<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="22" y1="20" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C7D2FE" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark base backing -->
  <rect width="64" height="64" rx="14" fill="#0A0E1A" />
  <rect width="64" height="64" rx="14" stroke="#4F46E5" stroke-width="1.5" stroke-opacity="0.3" fill="none" />

  <!-- Shield Outline with Gradient -->
  <path d="M32 8 L52 16 V32 C52 44.5 43.5 53.5 32 57 C20.5 53.5 12 44.5 12 32 V16 Z"
        fill="url(#shieldGrad)"
        fill-opacity="0.25"
        stroke="url(#shieldGrad)"
        stroke-width="2.5"
        stroke-linejoin="round" />

  <!-- Inner Identity Crest / Keyway -->
  <!-- User Head / Node -->
  <circle cx="32" cy="25" r="5.5" fill="url(#coreGrad)" filter="url(#glow)" />
  
  <!-- Identity Collar / Shield Wave -->
  <path d="M22 41 C22 35.5 26.5 33.5 32 33.5 C37.5 33.5 42 35.5 42 41" 
        stroke="#E0E7FF" 
        stroke-width="2.5" 
        stroke-linecap="round" />

  <!-- Security Node Keyline -->
  <circle cx="32" cy="46" r="2" fill="#38BDF8" />
  <line x1="32" y1="41" x2="32" y2="44" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
</svg>
